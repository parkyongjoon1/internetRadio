name: Update Radio URL Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 깃허브 저장소 쓰기 권한 명시
permissions:
  contents: write

jobs:
  update-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 최신 버전으로 수정

      - name: Set up Python
        uses: actions/setup-python@v5  # 최신 버전으로 수정
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_radio.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KBS 1radio stream URL" && git push)
