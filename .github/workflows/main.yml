name: Update Radio URL Daily

on:
  schedule:
    # 매일 자정(UTC 기준, 한국 시간으로는 아침 9시)에 자동으로 실행됩니다.
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동으로도 언제든 실행 버튼을 눌러 테스트할 수 있습니다.

jobs:
  update-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_radio.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KBS 1radio stream URL" && git push)
